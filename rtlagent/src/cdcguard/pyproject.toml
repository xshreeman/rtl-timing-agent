[project]
name = "cdcguard"
version = "0.1.0"
description = "Differential clock-domain-crossing certification for RTL changes"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0", "jsonschema>=4.0"]

[project.scripts]
cdcguard = "cdcguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
